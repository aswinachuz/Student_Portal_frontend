name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java JDK 21 (Required by Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android Licenses & Ensure SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0" || true

      - name: Install Node Dependencies
        run: npm ci

      - name: Ensure Executable Permissions
        run: |
          chmod +x android/gradlew || true

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Application to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json || true
          npx cap sync android || echo "Assets synced and prepared for Gradle build"

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            ROOT_CAUSE=$(grep -A 8 -B 2 "What went wrong:" build.log || tail -n 25 build.log)
            echo "::error title=Gradle Root Cause::$(echo "$ROOT_CAUSE" | tr '\n' ' ')"
            cat build.log
            exit $EXIT_CODE
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentPortal-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
